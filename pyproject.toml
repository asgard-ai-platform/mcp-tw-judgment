[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcp-tw-judgment"
version = "0.1.0"
description = "MCP Server for Tw Judgment — AI-callable tools via Model Context Protocol"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "Asgard AI Platform", email = "dev@asgard.ai"},
]

# Base dependencies (always required)
dependencies = [
    "requests>=2.31.0",
    "mcp>=1.0.0",
    "beautifulsoup4>=4.14.3",
]

# ---------------------------------------------------------------------------
# Connector-specific dependencies — uncomment what you need:
# ---------------------------------------------------------------------------
# RSS connector:
#   "feedparser>=6.0.0",
#
# Scraper connector:
#   "beautifulsoup4>=4.12.0",
#
# MQTT connector:
#   "paho-mqtt>=2.0.0",
# ---------------------------------------------------------------------------

[project.scripts]
mcp-tw-judgment = "mcp_server:main"

[tool.hatch.build.targets.wheel]
packages = ["config", "connectors", "auth", "tools", "parser"]
